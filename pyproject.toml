[project]
name = "methyl-flow"
version = "0.1.0"
description = "Reproducible bisulfite sequencing processing with nf-core/methylseq, plus conversion to a shared beta table, QC, and differential methylation."
readme = "README.md"
authors = [
    { name = "Todd Creasy", email = "toddcreasy@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pyarrow>=26.0.0",
]

[build-system]
requires = ["uv_build>=0.11.20,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not network'"
markers = ["network: test makes network calls; skipped by default, run with -m network"]

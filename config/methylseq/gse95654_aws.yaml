# GSE95654 on AWS Batch: same run as gse95654.yaml with inputs in the MethylFlowBatchStack bucket.
# Run with: scripts/run_methylseq.sh config/methylseq/gse95654_aws.yaml --compute aws
# Full parameter list: https://nf-co.re/methylseq/4.2.0/parameters

input: config/gse95654/samplesheet.aws.csv
rrbs: true

# GENCODE release 50 GRCh38 primary assembly, MD5 da1a11258be075cfa7af718162c894e7,
# uploaded from data/references/ (see gse95654.yaml for the source URL).
fasta: s3://methylflowbatchstack-bucket83908e77-cu41wphwya89/data/references/GRCh38.primary_assembly.genome.fa.gz
save_reference: true
igenomes_ignore: true

multiqc_title: methyl-flow GSE95654

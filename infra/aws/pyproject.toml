[project]
name = "methyl-flow-infra"
version = "0.1.0"
description = "AWS CDK app provisioning AWS Batch infrastructure for methyl-flow"
requires-python = ">=3.9"
dependencies = [
    "aws-cdk-lib>=2.170.0,<3.0.0",
    "constructs>=10.0.0,<11.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stacks"]
